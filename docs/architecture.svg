<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">MapleGuard banking transaction risk lakehouse architecture</title>
  <desc id="desc">Synthetic transactions flow through Bronze, Silver, model validation, Gold marts, and a Databricks dashboard with human review.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#071629"/>
      <stop offset="1" stop-color="#123A67"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.22"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#D6A84B"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="26" fill="url(#bg)"/>
  <text x="62" y="72" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="34" font-weight="700">MAPLEGUARD</text>
  <text x="62" y="106" fill="#BFD4EA" font-family="Arial, sans-serif" font-size="18">Privacy-safe transaction risk lakehouse • Hazim Ali</text>
  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <g transform="translate(55 170)">
      <rect width="190" height="170" rx="18" fill="#FFFFFF"/>
      <circle cx="38" cy="40" r="16" fill="#1976D2"/>
      <text x="66" y="47" fill="#0B1F3A" font-size="18" font-weight="700">SYNTHETIC</text>
      <text x="28" y="88" fill="#0B1F3A" font-size="25" font-weight="700">60K events</text>
      <text x="28" y="120" fill="#5F6B7A" font-size="15">No customer data</text>
      <text x="28" y="145" fill="#5F6B7A" font-size="15">Deterministic seed</text>
    </g>
    <g transform="translate(290 170)">
      <rect width="190" height="170" rx="18" fill="#EAF3FB"/>
      <text x="26" y="45" fill="#1976D2" font-size="17" font-weight="700">BRONZE</text>
      <text x="26" y="84" fill="#0B1F3A" font-size="23" font-weight="700">Raw events</text>
      <text x="26" y="118" fill="#5F6B7A" font-size="15">Schema contract</text>
      <text x="26" y="143" fill="#5F6B7A" font-size="15">Source preservation</text>
    </g>
    <g transform="translate(525 170)">
      <rect width="190" height="170" rx="18" fill="#F3F5F8"/>
      <text x="26" y="45" fill="#5F6B7A" font-size="17" font-weight="700">SILVER</text>
      <text x="26" y="84" fill="#0B1F3A" font-size="23" font-weight="700">Trusted data</text>
      <text x="26" y="118" fill="#5F6B7A" font-size="15">Quality checks</text>
      <text x="26" y="143" fill="#5F6B7A" font-size="15">Behaviour features</text>
    </g>
    <g transform="translate(760 170)">
      <rect width="190" height="170" rx="18" fill="#FFF7E8"/>
      <text x="26" y="45" fill="#B37B10" font-size="17" font-weight="700">MODEL + GOLD</text>
      <text x="26" y="84" fill="#0B1F3A" font-size="23" font-weight="700">Risk products</text>
      <text x="26" y="118" fill="#5F6B7A" font-size="15">Holdout metrics</text>
      <text x="26" y="143" fill="#5F6B7A" font-size="15">Alerts + KPI marts</text>
    </g>
    <g transform="translate(995 170)">
      <rect width="150" height="170" rx="18" fill="#FFF0E5"/>
      <text x="22" y="45" fill="#C56E14" font-size="17" font-weight="700">DECISION</text>
      <text x="22" y="83" fill="#0B1F3A" font-size="21" font-weight="700">Dashboard</text>
      <text x="22" y="116" fill="#5F6B7A" font-size="15">Risk trends</text>
      <text x="22" y="141" fill="#5F6B7A" font-size="15">Human review</text>
    </g>
  </g>
  <g stroke="#D6A84B" stroke-width="4" marker-end="url(#arrow)">
    <line x1="250" y1="255" x2="278" y2="255"/>
    <line x1="485" y1="255" x2="513" y2="255"/>
    <line x1="720" y1="255" x2="748" y2="255"/>
    <line x1="955" y1="255" x2="983" y2="255"/>
  </g>
  <rect x="55" y="395" width="1090" height="72" rx="16" fill="#0B2038" stroke="#2E5B88"/>
  <text x="82" y="428" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="16" font-weight="700">GOVERNANCE THROUGHOUT</text>
  <text x="82" y="453" fill="#BFD4EA" font-family="Arial, sans-serif" font-size="15">Data quality • time-aware validation • metric definitions • reason codes • documented limitations • reproducible tests</text>
</svg>

